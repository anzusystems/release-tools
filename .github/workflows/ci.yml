name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Package managers for the sample projects
        run: corepack enable
      - run: npm ci --ignore-scripts
      - name: Type check, unit and integration tests (e2e runs locally only)
        run: npm test
